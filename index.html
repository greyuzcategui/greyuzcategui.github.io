<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ing. Grey Uzcátegui | Portafolio Profesional</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background: #f0f2f5; 
            color: #1c1e21; 
        }
        .card { 
            text-align: center; 
            background: white; 
            padding: 3rem; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.1); 
            max-width: 500px;
        }
        h1 { margin-bottom: 0.5rem; color: #1976D2; }
        p { color: #4b4f56; line-height: 1.6; }
        .badge { 
            background: #e7f3ff; 
            color: #1877f2; 
            padding: 0.4rem 0.8rem; 
            border-radius: 20px; 
            font-size: 0.9rem; 
            font-weight: 600;
        }
        .footer { margin-top: 2rem; font-size: 0.8rem; color: #90949c; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Grey Uzcátegui</h1>
        <p><strong>Ingeniero de Sistemas</strong></p>
        <p>Líder Técnico | Arquitecto de Software | Fullstack Developer</p>
        <p><span class="badge">Sitio en Construcción</span></p>
        <p>Estamos migrando este portafolio a una experiencia moderna con <strong>Vue 3</strong> y <strong>Vuetify</strong>.</p>
        <div class="footer">
            Caracas, Venezuela | 2026
        </div>
    </div>
</body>
</html>
